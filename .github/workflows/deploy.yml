name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Bisa dijalankan manual dari tab Actions kalau deploy perlu diulang
  workflow_dispatch:

permissions:
  contents: read

# Jangan jalankan dua deploy bersamaan; deploy terbaru yang menang
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build JSON from CSV
        run: bun run scripts/build-json.js

      - name: Build REST API
        run: bun run scripts/build-api.js

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp index.html robots.txt manifest.json sw.js _site/
          cp -r css js icons _site/
          mkdir -p _site/schedule
          cp schedule/index.json _site/schedule/
          cp -r schedule/api _site/schedule/
          for year in schedule/*/; do
            if [ -d "$year/json" ]; then
              yearname=$(basename "$year")
              mkdir -p "_site/schedule/$yearname/json"
              cp "$year/json/"*.json "_site/schedule/$yearname/json/"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '_site'

  # Job terpisah (pola resmi GitHub Pages). Deploy di job yang sama dengan upload
  # beberapa kali gagal "No artifacts named github-pages were found" padahal
  # artifact-nya ada.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
